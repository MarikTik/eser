; eser runtime benchmark - flash to a board and read the table over serial at 115200 baud.
;
;   cd bench/runtime
;   pio run -e esp32dev -t upload && pio device monitor -b 115200
;
; Unlike the static benchmark in ../platformio.ini, this one needs hardware attached.
;
; Board coverage note. ESP32 / ESP32-WROOM-32 / ESP32-WROOM-32U are one PlatformIO target
; (esp32dev): same ESP32-D0WD die, same LX6 core, same toolchain. WROOM-32U differs from
; WROOM-32 only in using a U.FL external-antenna connector instead of the PCB trace antenna,
; which changes nothing this benchmark measures. They build byte-identical firmware.
; The S3 is a genuinely different target (Xtensa LX7), so it gets its own env.

[platformio]
src_dir = src

[env]
framework = arduino
build_flags = -std=gnu++17 -O2 -I${PROJECT_DIR}/../..
build_unflags = -std=gnu++11 -std=gnu++14
build_type = release
monitor_speed = 115200

; ESP32-D0WD: plain ESP32 devkit, WROOM-32, and WROOM-32U all map here.
[env:esp32dev]
platform = espressif32
board = esp32dev

; ESP32-S3-WROOM-1: Xtensa LX7, distinct timings from the LX6 above.
[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1

; ESP8266 NodeMCU (v2 and v3 alike -- same ESP-12E target, no separate v3 id).
[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
